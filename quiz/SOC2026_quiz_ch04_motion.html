<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOC 2026 학습 퀴즈(모션) · 4장 그림과 사례로 이해하는 주요 공격 원리</title>
<style>
:root{--g:#7B3F7E;--dg:#5A2C5C;--sky:#F0E6F1;--ink:#0B1630;--bd:#E2E6EB}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
 color:#fff;background:var(--ink);overflow:hidden;-webkit-text-size-adjust:100%}
/* 배경 — 느리게 떠다니는 도형 */
.bg{position:fixed;inset:0;overflow:hidden;background:
 radial-gradient(1200px 700px at 15% 20%,rgba(123,63,126,.55),transparent 60%),
 radial-gradient(900px 600px at 85% 80%,rgba(90,44,92,.6),transparent 60%),var(--ink)}
.bg i:nth-child(4){width:9vmax;height:9vmax;left:18vw;bottom:14vh;animation-duration:16s;border-color:rgba(255,255,255,.14)}
.bg i{position:absolute;border-radius:50%;border:1.5px solid rgba(255,255,255,.08);animation:drift 26s linear infinite}
.bg i:nth-child(1){width:46vmax;height:46vmax;left:-12vmax;top:-10vmax}
.bg i:nth-child(2){width:30vmax;height:30vmax;right:-8vmax;bottom:-12vmax;animation-duration:34s;animation-direction:reverse}
.bg i:nth-child(3){width:14vmax;height:14vmax;right:22vw;top:12vh;animation-duration:20s;border-style:dashed}
@keyframes drift{from{transform:rotate(0) translateX(1.2vmax) rotate(0)}to{transform:rotate(360deg) translateX(1.2vmax) rotate(-360deg)}}
/* HUD */
.hud{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:14px;padding:14px 18px;
 font-size:13px;color:rgba(255,255,255,.78)}
.hud .k{font-weight:700;letter-spacing:.04em}
.hud .bar{flex:1;height:4px;background:rgba(255,255,255,.14);border-radius:2px;overflow:hidden}
.hud .bar i{display:block;height:100%;width:0;background:#fff;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.hud .dots{display:flex;gap:6px}.hud .dots b{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25);transition:background .3s,transform .3s}
.hud .dots b.on{background:#fff;transform:scale(1.25);animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.45)}50%{box-shadow:0 0 0 6px rgba(255,255,255,0)}} .hud .dots b.done{background:rgba(255,255,255,.7)}
.mbtn{background:transparent;color:rgba(255,255,255,.85);border:1.5px solid rgba(255,255,255,.35);border-radius:999px;
 padding:6px 12px;font:inherit;font-size:12.5px;cursor:pointer}
/* 장면 */
.stage{position:fixed;inset:0;display:grid;place-items:center;padding:72px 20px 24px}
.scene{position:absolute;inset:72px 20px 24px;display:flex;flex-direction:column;overflow:auto;-webkit-overflow-scrolling:touch;opacity:0;visibility:hidden;
 transform:translateX(6vw) scale(.985);transition:opacity .45s,transform .55s cubic-bezier(.2,.8,.2,1),visibility 0s .55s}
.scene.on{opacity:1;visibility:visible;transform:none;transition:opacity .45s,transform .55s cubic-bezier(.2,.8,.2,1)}
.scene.out{opacity:0;transform:translateX(-6vw)}
.inner{width:min(860px,100%);outline:none;margin:auto;padding:4px 0;position:relative}
/* 인트로 */
.intro .chip{display:inline-block;background:rgba(255,255,255,.12);border-radius:999px;padding:5px 12px;font-size:13px;margin-bottom:16px}
.intro h1{font-size:clamp(26px,4.6vw,44px);line-height:1.25;margin:0 0 14px}
.intro p{color:rgba(255,255,255,.82);font-size:16px;margin:0 0 26px;max-width:620px}
.go{background:#fff;color:var(--dg);border:0;border-radius:14px;padding:14px 26px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;
 box-shadow:0 12px 30px rgba(0,0,0,.25);transition:transform .15s}
.go:hover{transform:translateY(-2px)}
/* 문항 */
.qnum{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:13px;letter-spacing:.08em;color:rgba(255,255,255,.75);margin-bottom:10px}
.qnum b{width:34px;height:34px;border-radius:10px;background:#fff;color:var(--dg);display:grid;place-items:center;font-size:14px}
.qtext{font-size:clamp(21px,3.2vw,31px);line-height:1.38;margin:0 0 22px;font-weight:800;min-height:1.4em}
.qtext .w{display:inline-block;opacity:0;transform:translateY(.6em)} .scene.on .qtext .w{animation:up .5s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{to{opacity:1;transform:none}}
.opts{display:grid;gap:10px}
.opt{position:relative;display:flex;gap:12px;align-items:flex-start;text-align:left;background:rgba(255,255,255,.96);color:#111;
 border:2px solid transparent;border-radius:14px;padding:14px 16px;font:inherit;font-size:15.5px;line-height:1.5;cursor:pointer;
 opacity:0;transform:translateY(14px);transition:transform .2s,box-shadow .2s,opacity .3s,border-color .2s}
.scene.on .opt{animation:up .5s cubic-bezier(.2,.8,.2,1) forwards}
.opt:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 10px 24px rgba(0,0,0,.22)}
.opt:focus-visible{outline:3px solid #fff;outline-offset:3px}
.opt .m{flex:0 0 30px;height:30px;border-radius:9px;background:var(--sky);color:var(--dg);display:grid;place-items:center;font-weight:800;font-size:13px}
.opt .key{position:absolute;right:12px;top:10px;font-size:11px;color:#5F5F5F;border:1px solid #D9DEE5;border-radius:5px;padding:1px 6px}
.q.answered .opt{cursor:default;transform:none;box-shadow:none;opacity:1;animation:none}
.q.answered .opt.dim{opacity:.38}
.q.answered .opt.ok{border-color:var(--g);box-shadow:0 0 0 4px rgba(255,255,255,.35),0 14px 30px rgba(0,0,0,.25);transform:scale(1.02);animation:glow .9s ease-out}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(255,255,255,.8)}100%{box-shadow:0 0 0 4px rgba(255,255,255,.35),0 14px 30px rgba(0,0,0,.25)}}
.spark{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;pointer-events:none;animation:spark .8s cubic-bezier(.2,.8,.2,1) forwards;z-index:5}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.q.answered .opt.ok .m{background:var(--g);color:#fff}
.q.answered .opt.ng{border-color:#111;border-style:dashed;animation:shake .45s cubic-bezier(.36,.07,.19,.97) both;opacity:1}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
.fb{margin-top:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:14px 16px;
 opacity:0;transform:translateY(16px);transition:opacity .4s,transform .5s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.q.answered .fb{opacity:1;transform:none;pointer-events:auto}
.fb .tag{display:inline-block;background:#fff;color:var(--dg);font-weight:800;font-size:12px;border-radius:6px;padding:3px 9px;margin-right:8px}
.fb .tag.ng{background:rgba(255,255,255,.25);color:#fff}
.fb .ex{margin-top:8px;font-size:14.5px;line-height:1.65;color:rgba(255,255,255,.92)}
.fb .bs{margin-top:6px;font-size:12.5px;color:rgba(255,255,255,.82)}
.fb .next{margin-top:12px;background:#fff;color:var(--dg);border:0;border-radius:11px;padding:10px 18px;font:inherit;font-weight:800;cursor:pointer}
/* 결과 */
.res{text-align:center}
.ring{width:170px;height:170px;margin:0 auto 14px;position:relative}
.ring svg{transform:rotate(-90deg)} .ring circle{fill:none;stroke-width:12}
.ring .tr{stroke:rgba(255,255,255,.15)} .ring .pr{stroke:#fff;stroke-linecap:round;stroke-dasharray:440;stroke-dashoffset:440;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;font-weight:900}
.ring .n small{display:block;font-size:13px;font-weight:600;color:rgba(255,255,255,.7)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.res h2{font-size:clamp(22px,3vw,30px);margin:6px 0 8px}
.res p{color:rgba(255,255,255,.82);margin:0 0 18px}
.recap{display:grid;gap:8px;text-align:left;margin:0 auto 20px;max-width:620px}
.recap div{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.08);border-radius:10px;padding:9px 12px;font-size:14px;
 opacity:0;transform:translateY(10px)}
.scene.on .recap div{animation:up .5s cubic-bezier(.2,.8,.2,1) forwards}
.recap b{flex:0 0 26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;background:#fff;color:var(--dg)}
.recap b.ng{background:rgba(255,255,255,.2);color:#fff}
.links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.links a,.links button{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.45);border-radius:11px;padding:10px 16px;
 font:inherit;font-weight:700;font-size:14px;text-decoration:none;cursor:pointer}
.links .pri{background:#fff;color:var(--dg);border-color:#fff}
/* 움직임 끄기 */
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}
 .qtext .w,.opt,.recap div{opacity:1!important;transform:none!important}}
html.nomo *,html.nomo *::before,html.nomo *::after{animation:none!important;transition:none!important}
html.nomo .qtext .w,html.nomo .opt,html.nomo .recap div{opacity:1!important;transform:none!important}
html.nomo .scene{transform:none!important}
@media(max-width:600px){.hud{gap:10px;padding:12px}.hud .dots{display:none}.opt{font-size:14.5px;padding:12px 14px}.opt .key{display:none}
 .scene{inset:64px 14px 16px}}
</style></head><body>

<script>window.DATA=[{"q": "4장이 공격을 바라보는 「네 가지 창」으로 든 것은?", "opts": ["방화벽 · WAF · 백신 · 백업", "사람 · 웹 · 파일과 실행 · 자원", "유출 · 중단 · 변조 · 지연", "예방 · 탐지 · 확인 · 대응"], "ans": 1, "basis": "현행 4장 33쪽 · RFCH05-002", "expl": "네 창은 모두 정상 기능이 악용되는 자리다."}, {"q": "「정상 이용」과 「기능 악용」의 차이로 옳은 것은?", "opts": ["정상 이용은 낮에 일어나고, 기능 악용은 밤에 일어난다", "기능 악용은 기능의 약점을 통해 뜻하지 않은 결과를 얻는 일이다", "기능 악용은 반드시 오류 화면이나 경고를 함께 만들어 낸다", "정상으로 보이는 화면에서는 기능 악용이 일어날 수 없다"], "ans": 1, "basis": "현행 4장 38쪽 · RFCH05-007", "expl": "약점이 있는 기능은 정상 화면으로도 악용될 수 있다."}, {"q": "서비스가 갑자기 느려지거나 멈췄을 때 4장의 설명으로 옳은 것은?", "opts": ["몰리는 일이 생겼다면 그것은 곧 공격이다", "인기 있는 신청 첫날의 혼잡도 공격으로 보아야 한다", "혼잡과 공격은 다르며, 누가 왜 몰리는지는 확인이 필요하다", "처리 여력은 무한하므로 서비스가 멈출 일은 없다", "느려진 것은 공격이 아니고, 완전히 멈춘 것만 공격이다"], "ans": 2, "basis": "현행 4장 41쪽 · RFCH05-010", "expl": "처리 여력을 넘기면 서비스가 느려지거나 멈춘다. 혼잡인지 공격인지는 확인해야 안다."}, {"q": "낯선 요청(사칭)을 받았을 때 4장에서 가르친 예방 행동은?", "opts": ["링크를 눌러 내용을 먼저 확인한다", "받은 메일에 답장해 진위를 묻는다", "알고 있던 연락처나 전화 등 별도 경로로 확인한다", "첨부를 열어 보고 이상하면 삭제한다"], "ans": 2, "basis": "현행 4장 36쪽 · RFCH05-005", "expl": "확인이 끝나기 전에는 링크를 열거나 정보를 보내지 않는다."}, {"q": "4장 마지막에 \"공격은 흔적을 남긴다\"고 한 뒤 그 기록을 읽는 장은?", "opts": ["5장 보안장비와 보호조치", "6장 로그와 경보", "7장 확인·연락·대응·보고", "12장 AI 활용"], "ans": 1, "basis": "현행 4장 42쪽 · RFCH05-011", "expl": "공격은 흔적을 남긴다. 그 기록은 6장에서 읽는다."}];</script>
<script>
(function(){
 var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return [].slice.call((r||document).querySelectorAll(s))};
 var D=window.DATA, i=-1, picked=[], scenes=$$('.scene'), MK=["①","②","③","④","⑤"];
 // 움직임: 시스템이 줄이기면 끄고 단추를 잠근다. 아니면 사용자의 선택을 이 탭 안에서 기억한다(저장 실패해도 동작).
 var OSR=matchMedia('(prefers-reduced-motion: reduce)').matches, mb=$('.mbtn');
 function store(v){try{sessionStorage.setItem('soc.nomo',v?'1':'0');}catch(e){}}
 function stored(){try{return sessionStorage.getItem('soc.nomo');}catch(e){return null;}}
 if(OSR){document.documentElement.classList.add('nomo');mb.disabled=true;mb.textContent='움직임 꺼짐 · 시스템 설정';mb.setAttribute('aria-pressed','true');}
 else{ if(stored()==='1')document.documentElement.classList.add('nomo');
   var syncM=function(){var off=document.documentElement.classList.contains('nomo');mb.textContent=off?'움직임 켜기':'움직임 끄기';mb.setAttribute('aria-pressed',off);};
   mb.addEventListener('click',function(){var off=document.documentElement.classList.toggle('nomo');store(off);syncM();}); syncM(); }
 var ft=null; function focusLater(sel,ms){ if(ft)clearTimeout(ft); ft=setTimeout(function(){var el=$(sel); if(el&&el.closest('.scene.on'))el.focus({preventScroll:true});},ms); }

 function show(k){
   scenes.forEach(function(s,j){ s.classList.toggle('out', j<k); s.classList.toggle('on', j===k); });
   var qi=k-1; $('.hud .bar i').style.width=(Math.max(0,Math.min(qi,D.length))/D.length*100)+'%';
   $$('.hud .dots b').forEach(function(b,j){b.classList.toggle('on',j===qi);b.classList.toggle('done',j<qi);});
   var sc=$('.scene.on'); if(sc){sc.scrollTop=0;} focusLater('.scene.on .inner',60);
 }
 function build(){
   D.forEach(function(q,qi){
     var sec=scenes[qi+1];
     $('.qtext',sec).innerHTML=q.q.split(' ').map(function(w,j){return '<span class="w" style="animation-delay:'+(j*45)+'ms">'+w+'</span>';}).join(' ');
     $('.opts',sec).innerHTML=q.opts.map(function(o,k){
       return '<button type="button" class="opt" data-k="'+k+'" style="animation-delay:'+(220+k*90)+'ms"><span class="m">'+MK[k]+'</span><span>'+o+'</span><span class="key">'+(k+1)+'</span></button>';}).join('');
     $$('.opt',sec).forEach(function(b){b.addEventListener('click',function(){answer(qi,+b.dataset.k);});});
   });
 }
 function answer(qi,k){
   var sec=scenes[qi+1]; if(sec.classList.contains('answered'))return;
   var q=D[qi]; picked[qi]=k; sec.classList.add('answered');
   $$('.opt',sec).forEach(function(b,j){ b.classList.toggle('ok',j===q.ans); b.classList.toggle('ng',j===k&&k!==q.ans); b.classList.toggle('dim',j!==q.ans&&j!==k); b.disabled=true; });
   var right=(k===q.ans);
   if(right&&!document.documentElement.classList.contains('nomo')){
     var okEl=$('.opt.ok',sec), r=okEl.getBoundingClientRect(), host=$('.inner',sec), hr=host.getBoundingClientRect();
     for(var s2=0;s2<10;s2++){var d=document.createElement('i');d.className='spark';var ang=s2/10*Math.PI*2, dist=60+Math.random()*50;
       d.style.left=(r.left-hr.left+r.width/2)+'px';d.style.top=(r.top-hr.top+r.height/2)+'px';
       d.style.setProperty('--dx',Math.cos(ang)*dist+'px');d.style.setProperty('--dy',Math.sin(ang)*dist+'px');
       d.style.background=s2%2?'#fff':getComputedStyle(document.documentElement).getPropertyValue('--sky');host.appendChild(d);setTimeout(function(x){x.remove();},900,d);}
   }
   $('#live').textContent='Q'+(qi+1)+' '+(right?'정답':'다시 보기')+' — 정답은 '+MK[q.ans]+' '+q.opts[q.ans];
   $('.fb',sec).innerHTML='<span class="tag'+(right?'':' ng')+'">'+(right?'정답':'다시 보기')+'</span><b>'+MK[q.ans]+' '+q.opts[q.ans]+'</b>'
     +'<div class="ex">'+q.expl+'</div><div class="bs">근거 · '+q.basis+'</div>'
     +'<button type="button" class="next">'+(qi+1<D.length?'다음 문항 →':'결과 보기 →')+'</button>';
   $('.next',sec).addEventListener('click',function(){ go(qi+2); });
   focusLater('.scene.on .next',450);
 }
 function go(k){
   if(k===D.length+1) result();
   i=k; show(k);
 }
 function result(){
   var ok=picked.filter(function(p,j){return p===D[j].ans;}).length, sec=scenes[D.length+1];
   $('.sr',sec).textContent=D.length+'문항 중 '+ok+'개 정답'; $('#live').textContent='결과 — '+D.length+'문항 중 '+ok+'개 정답';
   $('.recap',sec).innerHTML=D.map(function(q,j){var r=picked[j]===q.ans;
     return '<div style="animation-delay:'+(300+j*110)+'ms"><b class="'+(r?'':'ng')+'">Q'+(j+1)+'</b><span>'+(r?'맞음':'다시 보기')+' — '+q.q+'</span></div>';}).join('');
   setTimeout(function(){
     $('.pr',sec).style.strokeDashoffset=440-440*ok/D.length;
     var n=0,el=$('.ring .n span',sec),t=setInterval(function(){el.textContent=n; if(n>=ok)clearInterval(t); n++;},
       document.documentElement.classList.contains('nomo')?0:160);
   },200);
 }
 $('.go').addEventListener('click',function(){go(1);});
 $('.again').addEventListener('click',function(){location.reload();});
 document.addEventListener('keydown',function(e){
   if(i<1||i>D.length)return; var sec=scenes[i];
   if(/^[1-5]$/.test(e.key)&&!sec.classList.contains('answered')){var b=$('.opt[data-k="'+(+e.key-1)+'"]',sec); if(b)b.click();}
   if((e.key==='Enter'||e.key===' ')&&sec.classList.contains('answered')&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();go(i+1);}
 });
 build(); show(0);
})();
</script></body></html>
